<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Classroom Hive</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<style>
body{font-family:Arial;margin:0;background:#0f0f0f;color:white}
header{padding:15px;text-align:center;background:#111;color:#ffcc00}
.container{max-width:600px;margin:auto;padding:10px}
.card{background:#1c1c1c;padding:12px;border-radius:12px;margin:10px 0}
input,textarea{width:100%;padding:10px;margin:5px 0;background:#222;color:white;border:none}
button{padding:10px;background:#ffcc00;border:none;font-weight:bold;cursor:pointer}
.badge{color:#ffcc00;font-size:12px}
</style>
</head>

<body>

<header>📚 Classroom Hive</header>

<div class="container">

<input id="name" placeholder="Enter name">
<button onclick="login()">Enter Classroom</button>

<hr>

<input id="title" placeholder="Question or Lesson Title">
<textarea id="content" placeholder="Write here..."></textarea>

<button onclick="postQuestion()">Ask Question</button>
<button onclick="postLesson()">Post Lesson (Teachers)</button>

<div id="feed"></div>

</div>

<script>

// 🔥 FIREBASE CONFIG (PASTE YOURS HERE)
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentUser = "";

// 👤 LOGIN (simple)
function login(){
  currentUser = document.getElementById("name").value;
  if(!currentUser) return alert("Enter name");

  showFeed();
}

// 📌 POST QUESTION
function postQuestion(){
  if(!currentUser) return alert("Login first");

  db.collection("posts").add({
    user: currentUser,
    type: "question",
    title: title.value,
    content: content.value,
    time: Date.now()
  });

  title.value = "";
  content.value = "";
}

// 📖 POST LESSON
function postLesson(){
  if(!currentUser) return alert("Login first");

  db.collection("posts").add({
    user: currentUser,
    type: "lesson",
    title: title.value,
    content: content.value,
    time: Date.now()
  });

  title.value = "";
  content.value = "";
}

// 📚 LOAD FEED (REAL TIME)
function showFeed(){
  db.collection("posts")
    .orderBy("time","desc")
    .onSnapshot(snapshot=>{
      let feed = document.getElementById("feed");
      feed.innerHTML = "";

      snapshot.forEach(doc=>{
        let p = doc.data();

        feed.innerHTML += `
          <div class="card">
            <div class="badge">${p.type.toUpperCase()} • ${p.user}</div>
            <h3>${p.title}</h3>
            <p>${p.content}</p>
          </div>
        `;
      });
    });
}

</script>

</body>
</html>
